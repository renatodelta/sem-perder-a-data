name = "sem-perder-a-data"
pages_build_output_dir = "."
compatibility_date = "2024-10-01"

# Conexão com o banco de dados nativo Cloudflare D1 (SQLite)
[[d1_databases]]
binding = "DB"
database_name = "sem-perder-a-data-db"
# Substitua pelo ID gerado ao criar o banco na Cloudflare:
# database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
